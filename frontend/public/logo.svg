<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Rocket Body -->
  <path d="M256 100 L256 380 L220 350 L220 130 L256 100 Z" fill="url(#grad1)"/>
  <path d="M256 100 L256 380 L292 350 L292 130 L256 100 Z" fill="url(#grad1)" opacity="0.8"/>
  
  <!-- Rocket Window -->
  <circle cx="256" cy="180" r="30" fill="#fff" opacity="0.3"/>
  <circle cx="256" cy="180" r="20" fill="#fff" opacity="0.6"/>
  
  <!-- Rocket Fins -->
  <path d="M220 300 L180 360 L220 340 Z" fill="url(#grad2)"/>
  <path d="M292 300 L332 360 L292 340 Z" fill="url(#grad2)"/>
  
  <!-- Rocket Flame -->
  <ellipse cx="256" cy="395" rx="36" ry="50" fill="url(#grad2)" opacity="0.8"/>
  <ellipse cx="256" cy="400" rx="24" ry="40" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="256" cy="405" rx="12" ry="30" fill="#fff" opacity="0.7"/>
  
  <!-- B B Letters (BuildBack) -->
  <text x="256" y="270" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#fff" text-anchor="middle" opacity="0.9">BB</text>
  
  <!-- Stars/Sparkles -->
  <circle cx="140" cy="140" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="370" cy="160" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="120" cy="280" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="390" cy="300" r="4" fill="#fff" opacity="0.7"/>
  <circle cx="160" cy="420" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="350" cy="420" r="3" fill="#fbbf24" opacity="0.6"/>
</svg>